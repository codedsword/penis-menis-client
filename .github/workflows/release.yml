name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (created on the selected commit)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect jar
        id: jar
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n 1)
          out="sinepsinem-${version}+mc26.2.jar"
          cp "$jar" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Sinep Sinem Client ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.jar.outputs.file }}
          generate_release_notes: true
          body: |
            PvP utility client for **Minecraft 26.2**.

            **Install:** Fabric Loader 0.19.5+, Fabric API for 26.2 and Java 25. Drop the jar into `.minecraft/mods`.
            Open the ClickGui with Right Shift, the alt manager is on the title screen.
